<body class="contato-page">

    <div id="header-container"></div>

    <main>

        <section class="contato-hero">

            <div class="contato-container">

                <span class="contato-tag">
                    VENHA FAZER PARTE DESTA JORNADA
                </span>

                <h1>
                    Seja minha aluna
                </h1>

                <p>
                    A dança pode transformar autoestima,
                    expressão corporal, confiança e bem-estar.
                </p>

            </div>

        </section>

    <!-- ========================================= -->
    <!-- FORMULÁRIO DE INTERESSE -->
    <!-- ========================================= -->

    <section
        id="formulario-contato"
        class="lead-form-section">


        <div class="container">

            <h2>Vamos conversar?</h2>

            <p>
                Preencha seus dados e entraremos em contato para apresentar as aulas e tirar suas dúvidas.
            </p>
            
            <form
                id="contact-form"
                class="lead-form"
            >

                <input
                    type="text"
                    name="nome"
                    placeholder="Nome completo"
                    required
                >

                <input
                    type="tel"
                    name="whatsapp"
                    placeholder="WhatsApp"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                >

                <input
                    type="text"
                    name="cidade"
                    placeholder="Cidade"
                >

                <select
                    name="interesse"
                    required
                >
                    <option
                        value=""
                        selected
                        disabled
                    >
                        Tenho interesse em...
                    </option>


                    <option value="Aula Presencial">
                        Aula Presencial
                    </option>

                    <option value="Aula Online">
                        Aula Online
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Evento">
                        Evento
                    </option>

                </select>

                <textarea
                    name="mensagem"
                    rows="5"
                    placeholder="Conte um pouco sobre você..."
                ></textarea>

                <button type="submit">
                    Quero fazer parte
                </button>

            </form>

        </div>

    </section>
